name: Excavator

on:
  workflow_dispatch:
  schedule:
    # 每 2 小时一次：偶数小时 :07、奇数小时 :23，均取奇数分钟并错开整点。
    # GitHub schedule 是 best-effort，负载高时整次 tick 会被直接丢弃，
    # 两条 cron 交替可在一处丢失时仍有另一条兜底。
    - cron: '7 0-23/4 * * *'
    - cron: '23 2-23/4 * * *'

permissions:
  contents: write

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Excavate
        uses: ScoopInstaller/GithubActions@5bceeda181721d9d10a18fdcc3ddca6f33467ae6 # v3.0.0
        env:
          SKIP_UPDATED: 1
